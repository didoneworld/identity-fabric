name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Service containers cannot pass arguments, so SurrealDB is started by hand.
      - name: Start SurrealDB
        run: |
          docker run -d --name surrealdb -p 8000:8000 surrealdb/surrealdb:v2.3.10 \
            start --user root --pass root memory
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && exit 0; sleep 1; done
          docker logs surrealdb; exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      - name: Tests (unit + SurrealDB integration)
        env:
          TEST_SURREAL_URL: ws://127.0.0.1:8000/rpc
        run: pytest -v

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image and boot the full stack
        run: |
          cp .env.example .env
          sed -i \
            -e "s|^DOMAIN=.*|DOMAIN=http://localhost|" \
            -e "s|^SURREAL_PASS=.*|SURREAL_PASS=$(openssl rand -hex 24)|" \
            -e "s|^IDENTITY_FABRIC_ENC_KEY=.*|IDENTITY_FABRIC_ENC_KEY=$(openssl rand -hex 32)|" \
            -e "s|^IDENTITY_FABRIC_HMAC_KEY=.*|IDENTITY_FABRIC_HMAC_KEY=$(openssl rand -hex 32)|" \
            -e "s|^AUTONOMYX_AGENT_SECRET=.*|AUTONOMYX_AGENT_SECRET=ci-secret|" \
            -e "s|^IMAGE_TAG=.*|IMAGE_TAG=ci|" .env
          docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke test through Caddy
        run: |
          curl -sf http://localhost/readyz
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost/v1/resolve \
            -H 'content-type: application/json' -d '{"identifier":"a@b.co"}')" = 401
          curl -sf -X POST http://localhost/v1/resolve -H 'x-agent-secret: ci-secret' \
            -H 'content-type: application/json' -d '{"identifier":"a@b.co","tenant_id":"ci"}' \
            | grep -q '"not_found"'
      - name: Backup and restore round trip
        run: |
          ./scripts/backup.sh
          ./scripts/restore.sh backups/*.surql.gz restore_ci
      - if: failure()
        run: docker compose logs --no-color
