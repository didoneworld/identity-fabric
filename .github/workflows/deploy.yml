name: Deploy to OVH

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag to deploy (rollback). Empty = build this commit."
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    if: ${{ inputs.image_tag == '' }}
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    if: ${{ inputs.image_tag == '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Run after a successful build, or on its own for a rollback.
    if: ${{ always() && (needs.build.result == 'success' || inputs.image_tag != '') }}
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://${{ vars.DOMAIN }}
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ inputs.image_tag || github.sha }}
      APP_DIR: /opt/identity-fabric
      SSH_TARGET: ${{ secrets.OVH_USER }}@${{ secrets.OVH_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_KNOWN_HOSTS: ${{ secrets.OVH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$OVH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n  ServerAliveInterval 15\n' > ~/.ssh/config

      - name: Upload stack files
        run: |
          # shellcheck disable=SC2029
          tar czf - docker-compose.yml Caddyfile schema scripts .env.example \
            | ssh "$SSH_TARGET" "tar xzf - -C $APP_DIR"

      - name: Pull and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # shellcheck disable=SC2029  # GITHUB_ACTOR is expanded locally on purpose
          echo "$GHCR_TOKEN" | ssh "$SSH_TARGET" docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          ssh "$SSH_TARGET" bash -s -- "$APP_DIR" "$TAG" < scripts/remote-deploy.sh

      - name: Verify public endpoint
        run: |
          # shellcheck disable=SC2029
          for _ in $(seq 1 30); do
            if curl -sf "https://${{ vars.DOMAIN }}/readyz"; then echo; echo "Deployed $TAG"; exit 0; fi
            sleep 5
          done
          echo "readyz did not become healthy" >&2
          # shellcheck disable=SC2029
          ssh "$SSH_TARGET" "cd $APP_DIR && docker compose ps && docker compose logs --tail 100 --no-color api caddy"
          exit 1
